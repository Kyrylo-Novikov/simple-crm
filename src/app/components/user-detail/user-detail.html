<mat-card>
  <mat-card-content class="user-detail-header">
    <img src="./img/profil.png" alt="" srcset="" class="mr-16" />
    <div class="user-details">
      <h2>{{ user()?.firstName }}{{ user()?.lastName }}</h2>

      {{ user()?.email }}
    </div>
    <button matIconButton class="settings-btn" [matMenuTriggerFor]="userMenu">
      <mat-menu #userMenu="matMenu">
        <button (click)="editUserDetail()" mat-menu-item>Edit</button>
      </mat-menu>
      <mat-icon>more_vert</mat-icon>
    </button>
  </mat-card-content>
</mat-card>
<mat-card class="mt-32">
  <mat-card-content>
    <button matIconButton class="settings-btn" [matMenuTriggerFor]="addressMenu">
      <mat-menu #addressMenu="matMenu">
        <button (click)="editMenu()" mat-menu-item>Edit</button>
      </mat-menu>
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-card-title>Address</mat-card-title><br />
    <div>
      {{ user()?.street }} <br />
      {{ user()?.zipCode }} {{ user()?.city }}
    </div>
  </mat-card-content>
</mat-card>
